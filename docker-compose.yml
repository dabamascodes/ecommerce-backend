version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    container_name: ecommerce_postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - ecommerce_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_backend_app
    restart: always
    ports:
      - "${PORT}:${PORT}"
    environment:
      STAGE: ${STAGE}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      PORT: ${PORT}
    depends_on:
      - db
    networks:
      - ecommerce_network

networks:
  ecommerce_network:
    driver: bridge